
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Drop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #f5f1e9;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 7%;
      border-bottom: 1px solid #292929;
      letter-spacing: 5px;
      font-size: 19px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
    }

    .content {
      max-width: 550px;
    }

    .eyebrow {
      color: #a99b82;
      letter-spacing: 4px;
      font-size: 11px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 68px);
      letter-spacing: 5px;
      margin: 24px 0;
    }

    p {
      color: #aaa49a;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 15px 28px;
      border: 1px solid #b9a889;
      color: #f5f1e9;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 25px;
      border-top: 1px solid #292929;
      color: #777;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>DAILY DROP</header>

  <main>
    <div class="content">
      <div class="eyebrow">UNA NUEVA EXPERIENCIA CADA DÍA</div>
      <h1>ALGO NUEVO<br>TE ESPERA.</h1>
      <p>
        Cada día, una nueva oportunidad.
        Una selección exclusiva, disponible en cantidades limitadas.
      </p>
      <a class="button" href="#" onclick="return false;">
        PRÓXIMAMENTE
      </a>
    </div>
  </main>

  <footer>© 2026 DAILY DROP</footer>
</body>
</html>
